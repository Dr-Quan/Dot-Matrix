<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>汉字点阵显示系统</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
      color: #333;
    }
    .container {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .canvas-container {
      text-align: center;
      margin-bottom: 20px;
    }
    #ledCanvas {
      background: #000;
      border-radius: 8px;
      max-width: 100%;
      height: auto;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-group label,
    .control-group label {
      display: inline-block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    #hanzi,
    #fontSelect {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #333;
    }
    #hanzi {
      font-size: 22px;
      text-align: center;
    }
    .control-group {
      margin-bottom: 12px;
    }
    .info {
      font-size: 13px;
      color: #666;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
    .info p {
      margin: 4px 0;
    }
    #status {
      color: #c96a00;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="canvas-container">
      <canvas id="ledCanvas" width="240" height="240"></canvas>
    </div>

    <div class="controls">
      <div class="input-group">
        <label for="hanzi">输入汉字（限1个字符）：</label>
        <input type="text" id="hanzi" placeholder="请输入一个汉字" autocomplete="off" />
      </div>

      <div class="control-group">
        <label for="fontSelect">选择字体文件：</label>
        <select id="fontSelect">
          <option value="">-- 请选择字体文件 --</option>
          <option value="STDFONT.24">STDFONT.24</option>
          <option value="STDFONT.24B">STDFONT.24B</option>
          <option value="stdfont.24f">stdfont.24f</option>
          <option value="STDFONT.24K">STDFONT.24K</option>
          <option value="STDFONT.24L">STDFONT.24L</option>
          <option value="STDFONT.24R">STDFONT.24R</option>
          <option value="STDFONT.24S">STDFONT.24S</option>
        </select>
      </div>
    </div>

    <div class="info">
      <p>• 每个字符使用 576 比特 (72 字节) 表示</p>
      <p>• 字符索引范围：1 - <span id="maxIndex">?</span></p>
      <p>• 点阵状态：<span id="status">等待选择字体文件</span></p>
    </div>
  </div>

    function base64ToUint8Array(base64) {
      const binaryStr = atob(base64);
      const len = binaryStr.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryStr.charCodeAt(i);
      }
      return bytes;
    }

    const big5BinData = base64ToUint8Array(big5BinBase64);

    // 查找汉字在 big5BinData 的偏移量，返回字节偏移
    function findhanziInFile(hanzi) {
      const codePoint = hanzi.charCodeAt(0);
      const highByte = (codePoint >> 8) & 0xff;
      const lowByte = codePoint & 0xff;

      for (let i = 0; i < big5BinData.length - 1; i += 2) {
        if (big5BinData[i] === highByte && big5BinData[i + 1] === lowByte) {
          return i;  // 找到字节偏移量
        }
      }
      return 26188; // 默认值
    }

    // ====== 主功能 ======
    const canvas = document.getElementById("ledCanvas");
    const ctx = canvas.getContext("2d");
    const hanziInput = document.getElementById("hanzi");
    const fontSelect = document.getElementById("fontSelect");
    const statusEl = document.getElementById("status");
    const maxIndexEl = document.getElementById("maxIndex");

    const DOT_SIZE = 10;
    const ROWS = 24;
    const COLS = 24;
    const FONT_DIR = "./eten/";   // 字体文件目录

    let fontData = null;
    let totalChars = 0;
    let currentIndex = 1;

    // 初始化
    function init() {
      renderDefaultGrayGrid();
      setupEventListeners();
    }

    // 事件绑定
    function setupEventListeners() {
      // 输入：不再限制 maxlength，由代码自动保留最后输入的一个字
      hanziInput.addEventListener("input", (e) => {
        if (e.isComposing) return;   // 拼音输入法组字中，先不处理
        handleHanziInput();
      });
      hanziInput.addEventListener("compositionend", handleHanziInput);

      // 下拉菜单选择字体
      fontSelect.addEventListener("change", handleFontSelect);
    }

    // 下拉菜单加载字体文件
    async function handleFontSelect() {
      const fileName = fontSelect.value;

      if (!fileName) {
        fontData = null;
        totalChars = 0;
        maxIndexEl.textContent = "?";
        statusEl.textContent = "请选择字体文件";
        return;
      }

      statusEl.textContent = `正在加载 ${fileName} …`;

      try {
        const resp = await fetch(FONT_DIR + fileName);
        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
        }

        const arrayBuffer = await resp.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);

        const chars = Math.floor(data.length / 72);
        if (chars < 1) {
          throw new Error("文件太小，未包含完整字符数据");
        }

        fontData = data;
        totalChars = chars;
        currentIndex = 1;

        maxIndexEl.textContent = totalChars;
        statusEl.textContent = `已加载 ${fileName}（共 ${totalChars} 个字符）`;

        // 如果输入框里已有汉字，立即刷新显示
        if (hanziInput.value.trim()) {
          handleHanziInput();
        }
      } catch (error) {
        fontData = null;
        totalChars = 0;
        maxIndexEl.textContent = "?";
        statusEl.textContent =
          `加载失败：${error.message}（请确认 ${FONT_DIR}${fileName} 存在，并通过 HTTP 服务器打开本页面）`;
        console.error(error);
      }
    }

    // 处理汉字输入：新输入的字自动覆盖上一个字
    function handleHanziInput() {
      let input = hanziInput.value;

      // 关键点：只保留最后一个字符，实现“新字自动覆盖旧字”，无需手动删除
      if (input.length > 1) {
        input = input.slice(-1);
        hanziInput.value = input;
      }

      input = input.trim();

      if (!input) {
        statusEl.textContent = fontData
          ? "请在上方输入汉字"
          : "请选择字体文件";
        return;
      }

      // 通过映射文件查找索引
      const byteOffset = findhanziInFile(input);
      const index0 = byteOffset / 2;   // 映射文件中的顺序（从0开始）
      currentIndex = index0 + 1;       // 点阵文件索引从1开始

      if (fontData) {
        if (currentIndex < 1) currentIndex = 1;
        if (currentIndex > totalChars) currentIndex = totalChars;
        renderChar(currentIndex);
      } else {
        statusEl.textContent = "请先选择字体文件";
      }
    }

    // 绘制单个点
    function drawDot(x, y, isOn) {
      ctx.beginPath();
      ctx.arc(x, y, DOT_SIZE / 2 - 1, 0, Math.PI * 2);

      if (isOn) {
        ctx.fillStyle = "#FFA500";
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#FFA500";
      } else {
        ctx.fillStyle = "#333";
        ctx.shadowBlur = 0;
      }

      ctx.fill();
    }

    // 清空画布
    function clearCanvas() {
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 渲染缓冲区
    function renderBuffer(buffer) {
      try {
        clearCanvas();
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            const isOn = buffer[y][x] === 1;
            drawDot(x * DOT_SIZE + DOT_SIZE / 2, y * DOT_SIZE + DOT_SIZE / 2, isOn);
          }
        }
        ctx.shadowBlur = 0;
      } catch (error) {
        console.error("渲染错误:", error);
      }
    }

    // 渲染默认空白网格
    function renderDefaultGrayGrid() {
      const emptyBuffer = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      renderBuffer(emptyBuffer);
    }

    // 渲染字符点阵
    function renderChar(charIndex) {
      if (!fontData) return;

      const buffer = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      const startByte = (charIndex - 1) * 72;

      for (let row = 0; row < ROWS; row++) {
        const rowStart = startByte + row * 3;

        for (let byte = 0; byte < 3; byte++) {
          const byteValue = fontData[rowStart + byte];

          for (let bit = 0; bit < 8; bit++) {
            const isOn = (byteValue >> (7 - bit)) & 1;
            const col = byte * 8 + bit;
            buffer[row][col] = isOn;
          }
        }
      }

      renderBuffer(buffer);
      statusEl.textContent = `显示字符 #${charIndex} (${charIndex}/${totalChars})`;
    }

    window.onload = init;
  </script>
